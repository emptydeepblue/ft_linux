# ft_linux.conf — single source of truth for every build script.
#
# Loaded by scripts/lib/common.sh (bash syntax). Every value uses the
# ": ${VAR:=default}" form, so a variable already set in the environment wins:
#     LFS_DISK=/dev/sdb sudo -E bash scripts/01_setup/01_disk_partition.sh
#
# Machine-specific overrides (e.g. a different disk) go in
# config/ft_linux.local.conf, which is git-ignored and loaded after this file.

# ── Identity (subject: hostname and kernel version must contain the login) ───
: "${FT_LOGIN:=everonel}"
: "${FT_HOSTNAME:=$FT_LOGIN}"

# ── Versions ─────────────────────────────────────────────────────────────────
: "${LFS_VERSION:=12.4}"                      # LFS book, SysV flavour
: "${KVER:=6.16.1}"                           # kernel version (>= 4.0)
: "${KERNEL_RELEASE:=${KVER}-${FT_LOGIN}}"    # CONFIG_LOCALVERSION="-$FT_LOGIN"
# -> /boot/vmlinuz-$KERNEL_RELEASE, sources in /usr/src/kernel-$KVER

# ── Build host ───────────────────────────────────────────────────────────────
: "${LFS:=/mnt/lfs}"                          # mount point of the LFS root fs
: "${JOBS:=$(nproc)}"                         # parallel make jobs

# Where the repo (scripts/ + config/) is copied so that the lfs user and the
# chroot can read it: $LFS/sources/ft_linux on the host, /sources/ft_linux
# inside the chroot. Refreshed by scripts/sync_to_lfs.sh.
: "${FT_LFS_SUBDIR:=sources/ft_linux}"

# ── Target disk ──────────────────────────────────────────────────────────────
# LFS_DISK empty  -> build on a raw image file attached via a loop device.
# LFS_DISK=/dev/X -> build directly on that block device (DESTROYED!).
: "${LFS_DISK:=}"
: "${LFS_IMAGE:=/var/lib/ft_linux/ft_linux.img}"   # sparse raw image
: "${LFS_IMAGE_SIZE:=30G}"

# Partition layout (MBR/dos). Numbers must match fstab/grub.cfg:
#   p1 = /boot (ext4), p2 = / (ext4, rest of disk), p3 = swap
: "${BOOT_MIB:=512}"
: "${SWAP_MIB:=2048}"

# ── Evaluation VM (VirtualBox: SATA/AHCI port 0) ─────────────────────────────
# Device names as seen by the *booted* ft_linux, used for fstab and grub.cfg.
: "${VM_DISK:=/dev/sda}"
: "${VM_BOOT_DEV:=${VM_DISK}1}"
: "${VM_ROOT_DEV:=${VM_DISK}2}"
: "${VM_SWAP_DEV:=${VM_DISK}3}"
