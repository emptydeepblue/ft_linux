# /boot/grub/grub.cfg
# GRUB Configuration for ft_linux
#
# This file is generated manually or via grub-mkconfig
# Adapt kernel version and student_login to your specific setup

# Timeout before default entry boots (in seconds)
set timeout=5

# Default entry to boot (0-based index)
set default=0

# Kernel parameters
# - root: root filesystem device
# - ro: mount root as read-only initially
# - quiet: reduce boot messages (remove for debugging)

### BEGIN /etc/grub.d/00_header ###
if [ -s $prefix/grubenv ]; then
  load_env
fi

set pager=1

if [ "${recordfail}" = 1 ] ; then
  set timeout=30
else
  set timeout=5
fi
### END /etc/grub.d/00_header ###

### BEGIN /etc/grub.d/10_linux ###
menuentry "ft_linux - Linux 4.19.x-<student_login>" {
    set root='hd0,msdos1'
    linux   /vmlinuz-4.19.x-<student_login> root=/dev/sda2 ro quiet
    # Uncomment if using initrd
    # initrd  /initrd.img-4.19.x-<student_login>
}

menuentry "ft_linux - Linux 4.19.x-<student_login> (recovery mode)" {
    set root='hd0,msdos1'
    linux   /vmlinuz-4.19.x-<student_login> root=/dev/sda2 ro single
}

### END /etc/grub.d/10_linux ###

### BEGIN /etc/grub.d/40_custom ###
# Add custom entries here if needed
### END /etc/grub.d/40_custom ###