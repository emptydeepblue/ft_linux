# /boot/grub/grub.cfg — GRUB 2 configuration for ft_linux
#
# Disk layout (kept in sync with config/fstab):
#   (hd0,msdos1) → /dev/sda1 → /boot   (this file lives here)
#   (hd0,msdos2) → /dev/sda2 → /        (root filesystem, ext4)
#   (hd0,msdos3) → /dev/sda3 → swap
#
# Kernel parameters:
#   root=/dev/sda2  → device the kernel mounts as the root filesystem
#   ro              → mount root read-only first (fsck-friendly); init remounts rw
#   add "quiet" to hide boot messages, or "single" to drop into maintenance mode

set default=0
set timeout=5

insmod part_msdos
insmod ext2

menuentry "ft_linux — Linux 6.16.1-everonel" {
    set root=(hd0,msdos1)
    linux /vmlinuz-6.16.1-everonel root=/dev/sda2 ro
}

menuentry "ft_linux — Linux 6.16.1-everonel (recovery mode)" {
    set root=(hd0,msdos1)
    linux /vmlinuz-6.16.1-everonel root=/dev/sda2 ro single
}
